<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>THE LAST DREAM</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;background:#08070c;color:#eee;
 font-family:'IM Fell English',serif;touch-action:none;
}
canvas{display:block}
#intro{
 position:fixed;inset:0;z-index:10;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 background:radial-gradient(circle,#481321,#160b13 55%,#050408);
 text-align:center;padding:25px;
}
#intro h1{
 font-family:'UnifrakturCook',serif;
 color:#e2b8bd;font-size:clamp(43px,11vw,78px);
 text-shadow:0 0 25px #d52245;
 margin:0 0 12px;
}
#intro p{font-size:18px;color:#e5cdd1}
.gothicButton{
 color:#f5dce0;background:linear-gradient(145deg,#39101c,#10090f);
 border:1px solid #b66d7b;padding:13px 23px;
 font-family:'Cinzel Decorative',serif;
 font-size:11px;letter-spacing:1px;
 box-shadow:0 0 14px #8b1b35;
}
#hud{
 position:fixed;top:12px;left:12px;right:12px;
 display:flex;justify-content:space-between;gap:10px;
 color:#f0dadd;font:10px 'Cinzel Decorative',serif;
 text-shadow:0 0 8px #a91d3a;pointer-events:none;
}
#hint{
 position:fixed;top:42px;width:100%;
 text-align:center;color:#e2cbd0;font-size:12px;
 pointer-events:none;
}
#message{
 position:fixed;bottom:145px;left:8%;width:84%;
 text-align:center;color:#fff0f2;font-size:18px;
 text-shadow:0 2px 9px #000;pointer-events:none;
}
.control{
 position:fixed;border-radius:50%;
 border:2px solid #a77b83;
 background:radial-gradient(circle,#38202a 0%,#160c13 68%,#08070b 100%);
 box-shadow:0 0 14px #8d203b,inset 0 0 14px #a52b46;
 touch-action:none;
}
#controls{
 bottom:23px;left:20px;width:122px;height:122px;
}
#controls:after{
 content:"✥";position:absolute;top:50%;left:50%;
 transform:translate(-50%,-50%);
 font-size:35px;color:#d7b3ba;opacity:.32;
 pointer-events:none;
}
#stick{
 position:absolute;left:36px;top:36px;
 width:46px;height:46px;border-radius:50%;
 background:radial-gradient(circle,#a83c54,#3a101e);
 border:2px solid #e0b3bb;
 box-shadow:0 0 12px #d13c5b;z-index:2;
}
#look{
 bottom:28px;right:20px;width:112px;height:112px;
 display:flex;align-items:center;justify-content:center;
 color:#e6c8ce;font:10px 'Cinzel Decorative',serif;
 text-align:center;
}
#look:after{
 content:"✥";position:absolute;font-size:35px; color:#c08a96;opacity:.28;pointer-events:none;
}
#look span{z-index:1;pointer-events:none}
#interact{
 position:fixed;right:44px;bottom:153px;
 width:60px;height:60px;border-radius:50%;
 color:#fff0f2;font-size:23px;padding:0;
 background:radial-gradient(circle,#a8324d,#260b16);
 border:2px solid #d5a0aa;
 box-shadow:0 0 16px #c12748;
}
#status{
 position:fixed;bottom:12px;left:0;width:100%;
 text-align:center;color:#ad9299;
 font:9px 'Cinzel Decorative',serif;
 pointer-events:none;
}
</style>
</head>

<body>

<div id="intro">
 <h1>THE LAST DREAM</h1>
 <p>Hay recuerdos que ni siquiera el tiempo puede borrar.</p>
 <button class="gothicButton" id="start">ENTRAR AL SUEÑO</button>
</div>

<div id="hud">
 <span>THE LAST DREAM</span>
 <span>CAPÍTULO I</span>
</div>

<div id="hint">Explora el castillo. Algo te está esperando...</div>
<div id="message">El silencio guarda un secreto.</div>

<div id="controls" class="control">
 <div id="stick"></div>
</div>

<div id="look" class="control">
 <span>MOVER<br>CÁMARA</span>
</div>

<button id="interact">✧</button>
<div id="status">LA ROSA NEGRA · EL CASTILLO OLVIDADO</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ESCENA
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x17121d);
scene.fog=new THREE.FogExp2(0x24202c,0.006);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,.1,300
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.45;
document.body.appendChild(renderer.domElement);

// ILUMINACIÓN
scene.add(new THREE.HemisphereLight(0xc9d2ed,0x51404a,2.2));

const moonLight=new THREE.DirectionalLight(0xffd2d5,2.2);
moonLight.position.set(-20,30,-15);
moonLight.castShadow=true;
scene.add(moonLight);

const redLight=new THREE.PointLight(0xd52a48,100,90);
redLight.position.set(0,12,-35);
scene.add(redLight);

const silverLight=new THREE.PointLight(0x9eaddd,75,90);
silverLight.position.set(20,10,5);
scene.add(silverLight);

// LUNA
const moon=new THREE.Mesh(
 new THREE.SphereGeometry(8,48,48),
 new THREE.MeshBasicMaterial({color:0xc92a43})
);
moon.position.set(-22,27,-70);
scene.add(moon);

const moonGlow=new THREE.PointLight(0xe33b50,170,120);
moonGlow.position.copy(moon.position);
scene.add(moonGlow);

// ESTRELLAS
const starPositions=[];
for(let i=0;i<750;i++){
 starPositions.push(
  (Math.random()-.5)*200,
  Math.random()*85+5,
  -Math.random()*130-10
 );
}
const starGeo=new THREE.BufferGeometry();
starGeo.setAttribute(
 'position',new THREE.Float32BufferAttribute(starPositions,3)
);
const stars=new THREE.Points(
 starGeo,
 new THREE.PointsMaterial({
  color:0xf0eaff,size:.3,transparent:true,opacity:.9
 })
);
scene.add(stars);

// NUBES
const clouds=[];
for(let i=0;i<14;i++){
 const group=new THREE.Group();
 for(let j=0;j<8;j++){
  const puff=new THREE.Mesh(
   new THREE.SphereGeometry(2.5+Math.random()*2,12,10),
   new THREE.MeshBasicMaterial({
    color:0x352631,transparent:true,opacity:.67
   })
  );
  puff.position.set(j*2.5-8,Math.random()*2,0);
  puff.scale.y=.5;
  group.add(puff);
 }
 group.position.set(
  (Math.random()-.5)*120,
  14+Math.random()*24,
  -25-Math.random()*70
 );
 scene.add(group);
 clouds.push(group);
}

// TERRENO
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(220,220),
 new THREE.MeshStandardMaterial({color:0x34303a,roughness:1})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.12;
ground.receiveShadow=true;
scene.add(ground);

// CAMINO
const path=new THREE.Mesh(
 new THREE.PlaneGeometry(10,110),
 new THREE.MeshStandardMaterial({color:0x514751,roughness:1})
);
path.rotation.x=-Math.PI/2;
path.position.set(0,.01,-35);
scene.add(path);

// CONSTRUCCIÓN DEL CASTILLO
const castle=new THREE.Group();
scene.add(castle);

function block(w,h,d,x,y,z,color=0x393440){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color,roughness:.85})
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 castle.add(mesh);
 return mesh;
}

function tower(x,z,h=19){
 const base=new THREE.Mesh(
  new THREE.CylinderGeometry(3.5,4,h,12),
  new THREE.MeshStandardMaterial({color:0x49404a})
 );
 base.position.set(x,h/2,z);
 base.castShadow=true;
 castle.add(base);

 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(4.5,8,12),
  new THREE.MeshStandardMaterial({color:0x21141e})
 );
 roof.position.set(x,h+4,z);
 roof.castShadow=true;
 castle.add(roof);

 const lamp=new THREE.PointLight(0xc62b48,7,18);
 lamp.position.set(x,7,z+3);
 castle.add(lamp);
}

block(34,19,6,0,9,-48);
block(14,26,7,0,13,-43);
block(8,12,1,0,6,-39.2,0x171019);

tower(-17,-46,20);
tower(17,-46,20);
tower(-11,-57,17);
tower(11,-57,17);

// ALMENAS
for(let x=-14;x<=14;x+=4){
 block(2,2,2,x,20,-48,0x393440);
}

// VENTANAS
for(const x of [-10,-5,5,10]){
 const win=new THREE.Mesh(
  new THREE.BoxGeometry(1.5,3.5,.25),
  new THREE.MeshBasicMaterial({color:0xc43b54})
 );
 win.position.set(x,10,-44.8);
 castle.add(win);
}

// ÁRBOLES
const trees=[];
function createTree(x,z){
 const group=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.35,.65,5,8),
  new THREE.MeshStandardMaterial({color:0x493039})
 );
 trunk.position.y=2.5;
 group.add(trunk);

 for(let i=0;i<3;i++){
  const leaves=new THREE.Mesh(
   new THREE.ConeGeometry(3-i*.4,6,9),
   new THREE.MeshStandardMaterial({color:0x263b32})
  );
  leaves.position.y=5+i*2.4;
  group.add(leaves);
 }
 group.position.set(x,0,z);
 scene.add(group);
 trees.push(group);
}

for(let i=0;i<38;i++){
 createTree(-18-Math.random()*35,-4-Math.random()*100);
 createTree(18+Math.random()*35,-4-Math.random()*100);
}

// ROSAS
const roses=[];
function createRose(x,z){
 const group=new THREE.Group();

 const stem=new THREE.Mesh(
  new THREE.CylinderGeometry(.06,.09,1.4,7),
  new THREE.MeshStandardMaterial({color:0x527044})
 );
 stem.position.y=.7;
 group.add(stem);

 const flower=new THREE.Mesh(
  new THREE.SphereGeometry(.43,16,12),
  new THREE.MeshStandardMaterial({color:0x991c39})
 );
 flower.scale.set(1,.7,1);
 flower.position.y=1.5;
 group.add(flower);

 for(let i=0;i<3;i++){
  const petal=new THREE.Mesh(
   new THREE.SphereGeometry(.22,10,8),
   new THREE.MeshStandardMaterial({color:0x4b1024})
  );
  petal.scale.set(1,.6,1);
  petal.position.set(Math.cos(i*2.1)*.3,1.5,Math.sin(i*2.1)*.3);
  group.add(petal);
 }

 group.position.set(x,0,z);
 scene.add(group);
 roses.push(group);
}
for(let i=0;i<35;i++){
 createRose(-8-Math.random()*7,-5-Math.random()*70);
 createRose(8+Math.random()*7,-5-Math.random()*70);
}

// CONSTRUCTOR DE PERSONAJES
function createCharacter(options){
 const group=new THREE.Group();
 const skin=new THREE.MeshStandardMaterial({color:options.skin||0xd7ad99});
 const outfit=new THREE.MeshStandardMaterial({color:options.outfit||0x17151d});
 const hair=new THREE.MeshStandardMaterial({color:options.hair||0x493025});
 const detail=new THREE.MeshStandardMaterial({color:options.detail||0x29202a});

 function part(geo,mat,x,y,z,sx=1,sy=1,sz=1){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);
  m.scale.set(sx,sy,sz);
  m.castShadow=true;
  group.add(m);
  return m;
 }

 // CUERPO Y CHAQUETA
 part(new THREE.BoxGeometry(.85,1.25,.46),outfit,0,1.62,0);
 part(new THREE.BoxGeometry(.88,.16,.5),detail,0,2.15,0);

 // CUELLO Y CABEZA
 part(new THREE.CylinderGeometry(.13,.14,.25,12),skin,0,2.36,0);
 part(new THREE.SphereGeometry(.37,24,20),skin,0,2.72,0);

 // CABELLO
 part(new THREE.SphereGeometry(.4,20,16),hair,0,2.91,-.06,.99,.78,1.05);
 part(new THREE.BoxGeometry(.72,.18,.25),hair,0,2.65,.27);

 if(options.female){
  // CABELLO LARGO HASTA LOS HOMBROS
  for(const side of [-1,1]){
   part(new THREE.BoxGeometry(.2,.78,.24),hair,side*.34,2.48,-.02);
   part(new THREE.BoxGeometry(.21,.22,.25),detail,side*.34,2.12,-.02);
  }
  // FLEQUILLO
  part(new THREE.BoxGeometry(.7,.13,.18),hair,0,2.92,.29);
  // CORPIÑO GÓTICO MODESTO
  part(new THREE.BoxGeometry(.91,.68,.5),outfit,0,1.65,0);
  part(new THREE.BoxGeometry(.95,.12,.53),detail,0,1.27,0);
 }else{
  // TRAJE
  part(new THREE.BoxGeometry(.12,.8,.07),detail,-.16,1.65,.25);
  part(new THREE.BoxGeometry(.12,.8,.07),detail,.16,1.65,.25);
 }

 // BRAZOS
 const arms=[];
 for(const side of [-1,1]){
  const arm=part(new THREE.BoxGeometry(.24,.85,.27),outfit,side*.57,1.65,0);
  arms.push(arm);
  part(new THREE.SphereGeometry(.14,12,10),skin,side*.57,1.19,0);
 }

 // PIERNAS Y BOTAS
 const legs=[];
 for(const side of [-1,1]){
  const leg=part(new THREE.BoxGeometry(.3,.9,.35),outfit,side*.23,.48,0);
  legs.push(leg);
  part(new THREE.BoxGeometry(.34,.2,.48),detail,side*.23,.12,.06);
 }

 group.userData.arms=arms;
 group.userData.legs=legs;
 return group;
}

// PROTAGONISTA
const player=createCharacter({
 hair:0x503529,
 skin:0xd5a58f,
 outfit:0x17151c,
 detail:0x39303b
});
scene.add(player);
player.position.set(0,0,8);

// THE BLACK ROSE
const blackRose=createCharacter({
 female:true,
 hair:0xd6b16e,
 skin:0xe2b9a6,
 outfit:0x17131b,
 detail:0x30212e
});
blackRose.position.set(5,0,-33);
blackRose.rotation.y=-.5;
scene.add(blackRose);

// ILUMINACIÓN DEL JARDÍN
const gardenLight=new THREE.PointLight(0xa62b48,28,35);
gardenLight.position.set(5,5,-33);
scene.add(gardenLight);

// CÁMARA EN TERCERA PERSONA
let cameraAngle=0;
let verticalAngle=.18;
const cameraDistance=8;
let cameraHeight=2.1;

function updateCamera(){
 const target=new THREE.Vector3(
  player.position.x,
  player.position.y+1.65,
  player.position.z
 );

 const horizontal=Math.cos(verticalAngle)*cameraDistance;

 const desired=new THREE.Vector3(
  target.x+Math.sin(cameraAngle)*horizontal,
  target.y+cameraHeight+Math.sin(verticalAngle)*cameraDistance,
  target.z+Math.cos(cameraAngle)*horizontal
 );

 camera.position.lerp(desired,.15);
 camera.lookAt(target);
}

// JOYSTICK
const pad=document.getElementById('controls');
const stick=document.getElementById('stick');
let moveX=0,moveY=0,joystickActive=false;

pad.addEventListener('pointerdown',e=>{
 joystickActive=true;
 pad.setPointerCapture(e.pointerId);
 moveJoystick(e);
});
pad.addEventListener('pointermove',e=>{
 if(joystickActive)moveJoystick(e);
});
function moveJoystick(e){
 const rect=pad.getBoundingClientRect();
 let x=e.clientX-(rect.left+rect.width/2);
 let y=e.clientY-(rect.top+rect.height/2);
 const length=Math.hypot(x,y);
 if(length>37){x=x/length*37;y=y/length*37}
 moveX=x/37;
 moveY=y/37;
 stick.style.transform=`translate(${x}px,${y}px)`;
}
function releaseJoystick(){
 joystickActive=false;
 moveX=0;moveY=0;
 stick.style.transform='translate(0,0)';
}
pad.addEventListener('pointerup',releaseJoystick);
pad.addEventListener('pointercancel',releaseJoystick);

// CÁMARA LIBRE: IZQUIERDA, DERECHA, ARRIBA Y ABAJO
const look=document.getElementById('look');
let looking=false,lastLookX=0,lastLookY=0;

look.addEventListener('pointerdown',e=>{
 looking=true;
 lastLookX=e.clientX;
 lastLookY=e.clientY;
 look.setPointerCapture(e.pointerId);
});
look.addEventListener('pointermove',e=>{
 if(!looking)return;

 const dx=e.clientX-lastLookX;
 const dy=e.clientY-lastLookY;

 cameraAngle-=dx*.009;
 verticalAngle-=dy*.009;

 verticalAngle=THREE.MathUtils.clamp(
  verticalAngle,-.35,.95
 );

 lastLookX=e.clientX;
 lastLookY=e.clientY;
});
look.addEventListener('pointerup',()=>looking=false);
look.addEventListener('pointercancel',()=>looking=false);

// TECLADO PARA PRUEBAS
const keys={};
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// HISTORIA E INTERACCIONES
let started=false;
let nearRose=false;

const message=document.getElementById('message');

document.getElementById('start').addEventListener('click',()=>{
 started=true;
 document.getElementById('intro').style.display='none';
 message.textContent='Despiertas frente a un castillo. No recuerdas cómo llegaste.';
});

document.getElementById('interact').addEventListener('click',()=>{
 if(nearRose){
  message.textContent='The Black Rose te observa. «Pensé que habías olvidado el camino hacia mí».';
 }else{
  message.textContent='El viento susurra tu nombre entre los árboles.';
 }
});

// ANIMACIÓN
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();

 // CIELO
 clouds.forEach((cloud,i)=>{
  cloud.position.x+=.008+(i%3)*.002;
  if(cloud.position.x>85)cloud.position.x=-85;
 });

 stars.material.opacity=.68+Math.sin(t*2)*.22;
 moonGlow.intensity=165+Math.sin(t)*15;
 gardenLight.intensity=25+Math.sin(t*2)*4;

 roses.forEach((r,i)=>{
  r.rotation.z=Math.sin(t+i)*.05;
 });

 // PERSONAJES
 blackRose.position.y=Math.sin(t*1.5)*.035;

 if(started){
  let forward=moveY;
  let sideways=moveX;

  if(keys['w']||keys['arrowup'])forward-=1;
  if(keys['s']||keys['arrowdown'])forward+=1;
  if(keys['a']||keys['arrowleft'])sideways-=1;
  if(keys['d']||keys['arrowright'])sideways+=1;

  const direction=new THREE.Vector2(sideways,forward);
  if(direction.length()>1)direction.normalize();

  if(direction.length()>.04){
   const dx=direction.x*Math.cos(cameraAngle)+direction.y*Math.sin(cameraAngle);
   const dz=-direction.x*Math.sin(cameraAngle)+direction.y*Math.cos(cameraAngle);

   player.position.x+=dx*.12;
   player.position.z+=dz*.12;
   player.rotation.y=Math.atan2(dx,dz);

   const walk=Math.sin(t*10)*.35;
   player.userData.legs[0].rotation.x=walk;
   player.userData.legs[1].rotation.x=-walk;
   player.userData.arms[0].rotation.x=-walk*.7;
   player.userData.arms[1].rotation.x=walk*.7;
  }else{
   player.userData.legs.forEach(l=>l.rotation.x=0);
   player.userData.arms.forEach(a=>a.rotation.x=0);
  }

  player.position.x=THREE.MathUtils.clamp(player.position.x,-45,45);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-100,18);

  nearRose=player.position.distanceTo(blackRose.position)<5;

  if(nearRose){
   document.getElementById('hint').textContent='Hay alguien junto a las rosas...';
  }else{
   document.getElementById('hint').textContent='Explora el castillo. Algo te está esperando...';
  }

  updateCamera();
 }else{
  camera.position.set(0,10,22);
  camera.lookAt(0,9,-43);
 }

 renderer.render(scene,camera);
}
animate();

// CAMBIO DE TAMAÑO
window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
